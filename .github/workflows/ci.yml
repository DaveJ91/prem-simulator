name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel older runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 ships npm 10.9+, which understands the npm 11 lockfile format.
          # Node 20's npm 10.5 chokes on it.
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        # npm install (not npm ci) because the lockfile is generated on macOS
        # but CI runs on Linux — `npm ci` rejects platform-specific optional
        # deps that aren't in the lock. `npm install` resolves them at install
        # time. Slight loss of strictness for a cross-platform-friendly fit.
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        # `npm run build` is `tsc -b && vite build`, so this catches type errors
        # and bundling errors in one step.
        run: npm run build

  python:
    name: Python model (lint + import smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: model/requirements.txt

      - name: Install core deps
        # Bayesian deps (pymc, arviz) deliberately skipped — too heavy for a
        # smoke test. To validate bayesian.py changes, run locally.
        run: |
          pip install -r model/requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check model/

      - name: Import smoke test
        # Catches syntax errors and import-time crashes without hitting the
        # network or fitting any models. Sufficient as a "code still runs"
        # check for a small project.
        working-directory: model
        run: python -c "import dixon_coles, fetch_data, generate_odds"
